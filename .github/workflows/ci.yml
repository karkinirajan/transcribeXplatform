name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, pytest, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # uv installs the Python in .python-version itself, so no setup-python step is needed.
      - name: Install uv
        run: pipx install uv
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Dependency audit
        run: uv audit --preview-features audit-command

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the oldest supported (package.json "engines"); 26 is the current LTS (.nvmrc).
        node: ['24', '26']
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit

  desktop:
    name: Desktop shell (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      # The URL policy and the packaging list are tested with plain Node. The installers themselves (runtime bundle, ffmpeg,
      # electron-builder) are built locally with `make dist`; CI does not build them.
      - name: Tests
        run: npm test
      - name: Audit
        run: npm audit
